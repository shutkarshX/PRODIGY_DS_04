name: Populate Task 04 Outputs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download outputs
        run: |
          mkdir -p outputs
          curl -L --fail -o outputs/confusion_matrix.png https://raw.githubusercontent.com/shutkarshX/Prodigy-Infotech/main/Task-04/outputs/confusion_matrix.png
          curl -L --fail -o outputs/sentiment_distribution.png https://raw.githubusercontent.com/shutkarshX/Prodigy-Infotech/main/Task-04/outputs/sentiment_distribution.png
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet && exit 0
          git commit -m "Add Task 04 output visualizations"
          git push
