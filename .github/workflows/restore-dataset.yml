name: Restore dataset

on:
  push:
    paths:
      - ".github/workflows/restore-dataset.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download source dataset
        run: |
          curl -L "https://raw.githubusercontent.com/shutkarshX/Prodigy-Infotech/main/Task-04/dataset/twitter_training.csv" -o dataset/twitter_training.csv
          test -s dataset/twitter_training.csv
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/twitter_training.csv
          git diff --cached --quiet || git commit -m "Restore Task 4 dataset"
          git push
